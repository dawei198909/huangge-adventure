name: AI日报自动生成

on:
  # ⏸ 每日定时生成已于 2026-11-14 停用（应黄哥要求停止更新日报）
  #    网站与历史日报全部保留，只是不再自动新增。
  # ▶ 恢复方法：把下面 6 行 schedule 的注释取消，提交推送即可（其余代码无需改动）。
  # schedule:
  #   # UTC 时间。北京时间 = UTC + 8
  #   # 16:00 UTC = 北京 0:00（主触发，凌晨开始生成，7点前必上线）
  #   # 17:30 UTC = 北京 1:30（兜底1）
  #   # 19:00 UTC = 北京 3:00（兜底2，最晚3点开始，6点前完成）
  #   - cron: '0 16 * * *'
  #   - cron: '30 17 * * *'
  #   - cron: '0 19 * * *'
  workflow_dispatch:  # 仅保留手动触发（想临时补一期时用）

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成日报并推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARCHIVE_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TZ: Asia/Shanghai
        run: python3 daily_reports.py
