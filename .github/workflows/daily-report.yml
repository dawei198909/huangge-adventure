name: AI日报自动生成

on:
  schedule:
    # UTC 时间。北京时间 = UTC + 8
    # 22:00 UTC = 北京 6:00（主触发）
    # 23:30 UTC = 北京 7:30（兜底1）
    # 01:00 UTC = 北京 9:00（兜底2）
    - cron: '0 22 * * *'
    - cron: '30 23 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成日报并推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ARCHIVE_DIR: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 daily_reports.py
