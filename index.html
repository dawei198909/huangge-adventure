<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 AI 日报档案</title>
<style>
/* ===== 主题变量 ===== */
:root {
  --bg: #f6f1e7;
  --bg-soft: #efe8da;
  --card: #fffdf8;
  --card-border: #e2d9c5;
  --text: #3a342a;
  --text-soft: #8a8070;
  --accent: #b07d3e;
  --accent-soft: #e8d9c2;
  --code-bg: #f0e9dc;
  --shadow: rgba(120, 100, 60, 0.08);
  --tag-money: #b07d3e;
  --tag-frontier: #5d7b6f;
}
[data-theme="dark"] {
  --bg: #1f1d19;
  --bg-soft: #28251f;
  --card: #2b2822;
  --card-border: #3d382e;
  --text: #e8e2d6;
  --text-soft: #9a9184;
  --accent: #d4a55c;
  --accent-soft: #4a3f2b;
  --code-bg: #38332a;
  --shadow: rgba(0, 0, 0, 0.25);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  transition: background 0.3s, color 0.3s;
}

/* ===== 顶栏 ===== */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--card-border);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 16px;
  flex-wrap: wrap;
}
.header h1 { font-size: 20px; font-weight: 700; flex: 1; min-width: 160px; }
.header h1 span { color: var(--accent); }
.header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.search-box {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 14px;
  color: var(--text);
  width: 200px;
  outline: none;
  transition: border 0.2s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-soft); }

.theme-toggle {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 14px;
  cursor: pointer;
  color: var(--text);
}
.theme-toggle:hover { border-color: var(--accent); }

.type-tabs {
  display: flex; gap: 6px;
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 3px;
}
.type-tab {
  border: none; background: transparent;
  padding: 5px 14px; border-radius: 16px;
  font-size: 13px; cursor: pointer; color: var(--text-soft);
  transition: all 0.2s;
}
.type-tab.active { background: var(--accent); color: #fff; }

/* ===== 主布局 ===== */
.main {
  display: flex; min-height: calc(100vh - 62px);
  max-width: 1240px; margin: 0 auto;
}

/* 侧边日历 */
.sidebar {
  width: 280px; flex-shrink: 0;
  border-right: 1px solid var(--card-border);
  padding: 18px 14px;
  background: var(--bg-soft);
  position: sticky; top: 62px;
  height: calc(100vh - 62px);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.calendar-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.calendar-header .month-label {
  font-size: 15px; font-weight: 700; color: var(--text);
  user-select: none;
}
.calendar-header .nav-btn {
  width: 28px; height: 28px; border: none; border-radius: 8px;
  background: var(--card); color: var(--text);
  cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.calendar-header .nav-btn:hover { background: var(--accent-soft); }
.calendar-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; font-size: 11px; color: var(--text-soft);
  margin-bottom: 4px; font-weight: 600;
}
.calendar-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 2px; flex: 1;
}
.calendar-cell {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; font-size: 13px; color: var(--text);
  cursor: pointer; position: relative; transition: background 0.15s;
  user-select: none;
}
.calendar-cell:hover { background: var(--card); }
.calendar-cell.empty { cursor: default; }
.calendar-cell.empty:hover { background: transparent; }
.calendar-cell.today {
  background: var(--accent); color: #fff; font-weight: 700;
}
.calendar-cell.has-report::after {
  content: ""; position: absolute;
  bottom: 5px; left: 50%; transform: translateX(-50%);
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent);
}
.calendar-cell.today.has-report::after { background: #fff; }
.calendar-cell.active {
  box-shadow: inset 0 0 0 2px var(--accent);
  font-weight: 700;
}
.calendar-cell.today.active {
  box-shadow: inset 0 0 0 2px #fff;
}
.calendar-cell .tooltip {
  display: none; position: absolute;
  bottom: 110%; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg);
  padding: 3px 8px; border-radius: 6px;
  font-size: 11px; white-space: nowrap;
  pointer-events: none; z-index: 10;
}
.calendar-cell:hover .tooltip { display: block; }
.calendar-legend {
  margin-top: 12px; font-size: 11px; color: var(--text-soft);
  display: flex; align-items: center; gap: 6px;
}
.calendar-legend .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* 内容区 */
.content { flex: 1; padding: 32px 36px; max-width: 920px; }

.report-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 0;
  margin-bottom: 32px;
  box-shadow: 0 4px 20px var(--shadow);
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
}
.report-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px var(--shadow);
}
.report-card.money { border-left: 4px solid var(--tag-money); }
.report-card.frontier { border-left: 4px solid var(--tag-frontier); }
.report-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 0; flex-wrap: wrap;
  padding: 22px 30px 0 30px;
}
.report-head .type-badge {
  padding: 3px 12px; border-radius: 12px;
  font-size: 12px; font-weight: 600; color: #fff;
}
.type-badge.money { background: var(--tag-money); }
.type-badge.frontier { background: var(--tag-frontier); }
.report-head .report-date { font-size: 18px; font-weight: 700; }
.report-head .report-file { font-size: 12px; color: var(--text-soft); margin-left: auto; }

.report-body { padding: 4px 30px 28px 30px; }

.report-body h1, .report-body h2 { margin: 28px 0 12px; }
.report-body h1 { font-size: 26px; font-weight: 700; line-height: 1.35; }
.report-body h2 { font-size: 19px; font-weight: 600; color: var(--accent); line-height: 1.45; }
.report-body h3 { font-size: 16px; margin: 20px 0 8px; font-weight: 600; }
.report-body p { margin: 8px 0; font-size: 15px; line-height: 1.85; }
.report-body ul, .report-body ol { margin: 10px 0 10px 24px; font-size: 15px; line-height: 1.85; }
.report-body li { margin: 4px 0; }
.report-body blockquote {
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  padding: 10px 16px; border-radius: 0 10px 10px 0;
  margin: 12px 0;
  font-size: 15px;
}
.report-body code {
  background: var(--code-bg);
  padding: 2px 6px; border-radius: 5px;
  font-size: 13px;
  font-family: "SF Mono", Menlo, Consolas, monospace;
}
.report-body pre {
  background: var(--code-bg);
  padding: 14px 16px; border-radius: 10px;
  overflow-x: auto; margin: 12px 0;
  font-size: 13px; line-height: 1.5;
}
.report-body pre code { background: none; padding: 0; }
.report-body hr { border: none; border-top: 1px solid var(--card-border); margin: 20px 0; }
.report-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
.report-body th {
  background: var(--accent-soft); text-align: left;
  padding: 8px 10px; font-weight: 600;
}
.report-body td { padding: 8px 10px; border-bottom: 1px solid var(--card-border); }
.table-wrap { overflow-x: auto; }
.report-body a { color: var(--accent); text-decoration: none; }
.report-body a:hover { text-decoration: underline; }

.empty-state {
  text-align: center; padding: 80px 20px;
  color: var(--text-soft);
}
.empty-state .big { font-size: 48px; margin-bottom: 12px; }

/* 高亮搜索 */
mark { background: #f2d98c; color: #3a342a; padding: 0 2px; border-radius: 3px; }
[data-theme="dark"] mark { background: #6b5a2a; color: #fff; }

/* 回到顶部 */
.back-to-top {
  position: fixed; bottom: 28px; right: 28px;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 20px; cursor: pointer;
  opacity: 0; transform: translateY(16px);
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  z-index: 200;
}
.back-to-top.visible {
  opacity: 1; transform: translateY(0);
  pointer-events: auto;
}
.back-to-top:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.25); }

/* 响应式 */
@media (max-width: 800px) {
  .main { flex-direction: column; }
  .sidebar {
    width: 100%; position: static; height: auto;
    border-right: none; border-bottom: 1px solid var(--card-border);
    max-height: none; padding: 12px;
    flex-direction: row; flex-wrap: wrap; gap: 8px; align-items: flex-start;
  }
  .calendar-header { width: 100%; }
  .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .calendar-cell { font-size: 11px; }

  .content { padding: 16px; }
  .report-card { padding: 18px; }
  .search-box { width: 140px; }
}
</style>
</head>
<body>
<div class="header">
  <h1>📚 AI 日报档案 <span>· 每日一读</span></h1>
  <div class="header-actions">
    <div class="type-tabs" id="typeTabs">
      <button class="type-tab active" data-type="all">全部</button>
      <button class="type-tab" data-type="money">💰 赚钱案例</button>
      <button class="type-tab" data-type="frontier">📡 前沿情报</button>
    </div>
    <input class="search-box" id="searchBox" type="text" placeholder="🔍 搜索日报内容...">
    <button class="theme-toggle" id="themeToggle">🌙 深色</button>
  </div>
</div>

<div class="main">
  <aside class="sidebar">
    <div class="calendar-header">
      <button class="nav-btn" id="prevMonth" title="上个月">◀</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="nav-btn" id="nextMonth" title="下个月">▶</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="calendar-legend">
      <span class="dot"></span> 有日报
    </div>
  </aside>
  <main class="content" id="content"></main>
</div>

<script src="data.js"></script>

<button class="back-to-top" id="backToTop" title="回到顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ===== 状态 =====
let currentDate = null;
let currentType = "all";

// ===== 工具 =====
let searchQuery = "";
function getDates() {
  const dates = {};
  REPORTS.forEach(r => {
    if (!dates[r.date]) dates[r.date] = { money: 0, frontier: 0 };
    dates[r.date][r.type]++;
  });
  return Object.keys(dates).sort().reverse();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlightText(text, query) {
  if (!query) return text;
  const esc = escapeHtml(text);
  const escQuery = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("(" + escQuery + ")", "gi");
  return esc.replace(re, "<mark>$1</mark>");
}

// ===== 渲染 =====
// ===== 日历状态 =====
let calYear, calMonth;

function getReportDates() {
  const set = new Set();
  REPORTS.forEach(r => set.add(r.date));
  return set;
}

function renderCalendar() {
  const grid = document.getElementById("calendarGrid");
  const label = document.getElementById("monthLabel");
  const reportDates = getReportDates();
  const today = new Date().toISOString().slice(0, 10);
  
  const firstDay = new Date(calYear, calMonth, 1);
  const firstWeekday = firstDay.getDay(); // 0=Sun
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  
  label.textContent = `${calYear}年${calMonth + 1}月`;
  
  const cells = [];
  // Empty cells before first day
  for (let i = 0; i < firstWeekday; i++) {
    cells.push(`<div class="calendar-cell empty"></div>`);
  }
  // Day cells
  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const hasReport = reportDates.has(dateStr);
    const isToday = dateStr === today;
    const isActive = dateStr === currentDate;
    cells.push(
      `<div class="calendar-cell${hasReport ? " has-report" : ""}${isToday ? " today" : ""}${isActive ? " active" : ""}"
           data-date="${dateStr}" data-has="${hasReport ? 1 : 0}">
         ${day}
         <span class="tooltip">${dateStr}</span>
       </div>`
    );
  }
  grid.innerHTML = cells.join("");
  
  grid.querySelectorAll(".calendar-cell:not(.empty)").forEach(el => {
    if (el.dataset.has === "1") {
      el.addEventListener("click", () => {
        currentDate = el.dataset.date;
        renderCalendar();
        renderContent();
      });
    }
  });
}

function renderContent() {
  const container = document.getElementById("content");
  let reports = REPORTS;
  if (currentDate) reports = reports.filter(r => r.date === currentDate);
  if (currentType !== "all") reports = reports.filter(r => r.type === currentType);
  
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    reports = reports.filter(r => r.content.toLowerCase().includes(q));
  }
  
  if (reports.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="big">📭</div>
      <p>${searchQuery ? "没有找到匹配的内容" : "这一天没有日报"}</p>
    </div>`;
    return;
  }
  
  // 按日期倒序渲染
  const byDate = {};
  reports.forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  });
  
  const dates = Object.keys(byDate).sort().reverse();
  container.innerHTML = dates.map(d => {
    return byDate[d].map(r => `
      <article class="report-card ${r.type}" data-date="${r.date}" data-type="${r.type}">
        <div class="report-head">
          <span class="type-badge ${r.type}">${r.type === "money" ? "💰 赚钱案例" : "📡 前沿情报"}</span>
          <span class="report-date">${r.date}</span>
          <span class="report-file">${escapeHtml(r.filename)}</span>
        </div>
        <div class="report-body">${r.html}</div>
      </article>
    `).join("");
  }).join("");
}

// ===== 事件 =====
document.getElementById("typeTabs").addEventListener("click", e => {
  const tab = e.target.closest(".type-tab");
  if (!tab) return;
  document.querySelectorAll(".type-tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  currentType = tab.dataset.type;
  renderContent();
});

let searchTimer;
document.getElementById("searchBox").addEventListener("input", e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    if (searchQuery) currentDate = null;  // 搜索时忽略日期过滤
    renderCalendar();
    renderContent();
  }, 250);
});

document.getElementById("themeToggle").addEventListener("click", () => {
  const current = document.documentElement.dataset.theme;
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  document.getElementById("themeToggle").textContent = next === "dark" ? "☀️ 浅色" : "🌙 深色";
  localStorage.setItem("theme", next);
});

// ===== 初始化 =====
(function init() {
  const savedTheme = localStorage.getItem("theme");
  if (savedTheme === "dark") {
    document.documentElement.dataset.theme = "dark";
    document.getElementById("themeToggle").textContent = "☀️ 浅色";
  }
  const today = new Date();
  calYear = today.getFullYear();
  calMonth = today.getMonth();
  const dates = getDates();
  if (dates.length > 0) currentDate = dates[0];  // 默认最新一天
  renderCalendar();
  renderContent();

  // 月历翻页
  document.getElementById("prevMonth").addEventListener("click", () => {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", () => {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });

  // 回到顶部按钮显隐
  const backBtn = document.getElementById("backToTop");
  window.addEventListener("scroll", () => {
    backBtn.classList.toggle("visible", window.scrollY > 300);
  }, {passive: true});
})();
</script>
</body>
</html>
